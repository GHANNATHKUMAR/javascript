<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A bar </title>
    <style>
       .nav{
            display: flex;
            background-color: #333;
            padding: 10px;
            
        }
        .nav a{
            color: white;
            text-decoration: none;
            margin-right: 20px;
            text-align: center;
            
        }
        .nav a:hover{
            text-decoration: underline;
       }
       table {
        border-spacing: 5px;
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
       }
    </style>
</head>
<body>
    <div class="nav">
        <a href="/home">Home</a>
        <a href="/about">About</a>
        <a href="/contact">Contact</a>

</html>
