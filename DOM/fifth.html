<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>BMI Calculator</title>
    <style>
        /* Reset basic styles */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background-color: #212121;
    color: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
}

/* Navigation Bar */
nav {
    width: 100%;
    background-color: #ffffff;
    padding: 10px 20px;
    display: flex;
    justify-content: flex-end;
    gap: 15px;
}

nav a {
    color: #000000;
    text-decoration: none;
    font-weight: bold;
    padding: 8px 16px;
    border: 1px solid #000000;
    border-radius: 4px;
}

nav a:hover {
    background-color: #f0f0f0;
}

/* Main Container */
.container {
    width: 375px;
    margin-top: 50px;
    background-color: #797979;
    padding: 30px;
    border-radius: 8px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
}

h1 {
    font-size: 24px;
    margin-bottom: 30px;
}

/* Form Styles */
form p {
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

label {
    font-size: 14px;
}

input[type="text"] {
    width: 150px;
    height: 35px;
    border: none;
    border-radius: 4px;
    padding: 5px;
    font-size: 16px;
}

/* Button */
button {
    width: 150px;
    height: 40px;
    font-size: 18px;
    font-weight: bold;
    color: #000000;
    background-color: #ffffff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin: 10px 0 25px 0;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
}

button:hover {
    background-color: #e0e0e0;
}

/* Results Display */
#results { 
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 20px;
}

/* Weight Guide */
#weight-guide {
    text-align: left;
    margin-top: 20px;
}

#weight-guide h3 {
    font-size: 16px;
    margin-bottom: 10px;
}

#weight-guide p {
    font-size: 14px;
    margin-bottom: 8px;
    display: block;
}

    </style>
</head>
<body>
    <div class="container">
        <h1>BMI Calculator</h1>
        <form>
            <p><label>Height in CM: </label><input type="text" id="height" /></p>
            <p><label>Weight in KG: </label><input type="text" id="weight" /></p>
            <button>Calculate</button>
            <div id="results"></div>
            <div id="weight-guide">
                <h3>BMI Weight Guide</h3>
                <p>Under Weight = Less than 18.6</p>
                <p>Normal Range = 18.6 and 24.9</p>
                <p>Overweight = Greater than 24.9</p>
            </div>
        </form>
    </div>
</body>
<script>
const form = document.querySelector('form'); 
form.addEventListener('submit' , (e)=>{
    e.preventDefault();
    
    const height=parseInt(document.querySelector('#height').value); 
      const weight=parseInt(document.querySelector('#weight').value); 

      const result=document.querySelector('#results'); 
      console.log("hello"); 
      if(height=='' || height<0 || isNaN(height)) {
        result.innerHTML=`please give a valid ${height}`;
      }
      else if(weight=='' || weight<0 || isNaN(weight)) {
        result.innerHTML=`please give a valid ${weight}`;
      }
      else {
        const bmi = (weight / ((height*height)/10000 ) ) . toFixed(2) ; 
        result.innerHTML=`<span>${bmi} </span>`;
        if(bmi<18.6) {
            alert(`Under Weight = Less than 18.6`);

        }
        else if(bmi<24.9){
            alert(`Normal Range = 18.6 and 24.9`);
        }
        else{
            alert(`Overweight = Greater than 24.9`);
        }
      }


})

</script>
</html>
